name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'

# Read-only: this job builds and uploads an artifact and never writes to the
# repo. Without an explicit block the job inherits whatever default the repo or
# org sets, which on older repos is a read-write token handed to every third
# party action in the build.
permissions:
  contents: read

jobs:
  build:
    # release.ps1's version-bump commit is handled by release.yml; skip it here
    # so a release does not build twice.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # v3

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11  # v0.9.6
        with:
          cache: true

      # Same command a developer runs. No build logic lives in this workflow.
      - name: Build and package
        shell: pwsh
        run: |
          pixi run package
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pixi run package failed"
            exit 1
          }

      # Covers the shared submodule, which the mod build compiles with tests
      # off. Binds real loopback ports, so it needs a runner, not a container.
      - name: Test
        run: pixi run test

      - name: Stage installer contents for artifact upload
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/*-installer.zip" | Select-Object -First 1
          if (-not $installer) {
            Write-Host "::error::No installer ZIP found to stage"
            exit 1
          }
          $dest = "release/artifact-contents"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Expand-Archive -Path $installer.FullName -DestinationPath $dest -Force
          Write-Host "Staged $($installer.Name) to $dest"

      - name: Compute artifact name from ref
        shell: pwsh
        run: |
          $branch = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
          $sanitized = $branch -replace '[^A-Za-z0-9._-]', '-'
          "ARTIFACT_NAME=MinecraftHeadTracking-$sanitized" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release/artifact-contents/
          retention-days: 14
          if-no-files-found: error
